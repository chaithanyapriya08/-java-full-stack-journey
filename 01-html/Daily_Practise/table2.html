<body>

    <h2>Table with colspan and rowspan</h2>
    <table border="3" width="200" height="200">
            <td colspan="3"> King 1</td>
             <!-- <td>King 2</td>
              <td>King 3</td> -->
        </tr>
        <tr>
             <td>King 4</td>
              <td>King 5</td>

<br>
<br>
    <table border="3" width="200" height="200">

               <td>King 9</td>
        </tr>
    </table>


<br>
